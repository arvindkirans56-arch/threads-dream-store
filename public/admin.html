<!doctype html><meta name=viewport content="width=device-width,initial-scale=1"><title>Threads Dream Admin</title><style>body{font-family:Arial;margin:0;background:#fff8fb;color:#4b3435}.bar{background:#e66a95;color:#fff;padding:16px}.wrap{max-width:1100px;margin:auto;padding:15px}.card{background:#fff;padding:18px;border-radius:13px;margin:12px 0;box-shadow:0 2px 12px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select,textarea{width:100%;padding:10px;margin:4px 0;border:1px solid #e4cbd3;border-radius:7px}.btn{background:#e66a95;color:#fff;border:0;padding:10px 14px;border-radius:7px;font-weight:bold}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #eee;text-align:left;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><div class=bar><b>Threads Dream — Admin Panel</b></div><main class=wrap><section id=login class=card><h2>Admin Login</h2><input id=tok type=password placeholder="Admin token"><button class=btn onclick=go()>Login</button><p>Demo token: <b>change-this-admin-token</b></p></section><div id=app style="display:none"><section class=card><h2>Store Settings</h2><input id=store placeholder="Store name"><input id=wa placeholder="WhatsApp number e.g. 9198XXXXXXXX"><input id=upi placeholder="UPI ID"><button class=btn onclick=save()>Save</button></section><section class=card><h2>Categories</h2><input id=cat placeholder="Category name"><button class=btn onclick=addCat()>Add Category</button><div id=cl></div></section><section class=card><h2>Add Product</h2><div class=grid><input id=pn placeholder="Product name"><select id=pc></select><input id=pp type=number placeholder="Selling price"><input id=pm type=number placeholder="MRP"><input id=ps type=number placeholder="Stock"><input id=pi placeholder="Image URL"></div><textarea id=pd placeholder="Description"></textarea><button class=btn onclick=addProduct()>Add Product</button></section><section class=card><h2>Products</h2><div id=pl></div></section><section class=card><h2>Orders</h2><div style="overflow:auto"><table id=ol></table></div></section></div></main><script>let T,D;async function api(u,o={}){o.headers={...(o.headers||{}),"x-admin-token":T};if(o.body)o.headers["Content-Type"]="application/json";let r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error);return d}async function go(){T=tok.value;try{await api("/api/admin/data");login.style.display="none";app.style.display="block";load()}catch(e){alert(e.message)}}async function load(){D=await api("/api/admin/data");store.value=D.settings.store_name||"";wa.value=D.settings.whatsapp_number||"";upi.value=D.settings.upi_id||"";pc.innerHTML=D.categories.filter(c=>c.active).map(c=>`<option value=${c.id}>${c.name}</option>`).join("");cl.innerHTML=D.categories.map(c=>`<p>${c.name} <button class=btn onclick="delCat(${c.id})">Hide</button></p>`).join("");pl.innerHTML=D.products.map(p=>`<p><b>${p.name}</b> — ₹${p.price} — Stock ${p.stock} <button class=btn onclick="delProd(${p.id})">Hide</button></p>`).join("");ol.innerHTML="<tr><th>#</th><th>Customer</th><th>Total</th><th>Payment</th><th>Status</th><th>Action</th></tr>"+D.orders.map(o=>`<tr><td>${o.id}</td><td>${o.customer_name}<br>${o.phone}</td><td>₹${o.total}</td><td>${o.payment_method}</td><td>${o.order_status}</td><td><button class=btn onclick="st(${o.id},'CONFIRMED')">Confirm</button> <button class=btn onclick="st(${o.id},'SHIPPED')">Ship</button> <button class=btn onclick="st(${o.id},'DELIVERED')">Done</button></td></tr>`).join("")}async function save(){await api("/api/admin/settings",{method:"POST",body:JSON.stringify({store_name:store.value,whatsapp_number:wa.value,upi_id:upi.value})});alert("Saved")}async function addCat(){await api("/api/admin/categories",{method:"POST",body:JSON.stringify({name:cat.value})});cat.value="";load()}async function delCat(id){await api("/api/admin/categories/"+id,{method:"DELETE"});load()}async function addProduct(){await api("/api/admin/products",{method:"POST",body:JSON.stringify({name:pn.value,category_id:pc.value,price:pp.value,mrp:pm.value,stock:ps.value,image:pi.value,description:pd.value})});alert("Product added");pn.value=pp.value=pm.value=ps.value=pi.value=pd.value="";load()}async function delProd(id){await api("/api/admin/products/"+id,{method:"DELETE"});load()}async function st(id,s){await api("/api/admin/orders/"+id,{method:"PUT",body:JSON.stringify({order_status:s})});load()}</script>
