<!doctype html><meta name=viewport content="width=device-width,initial-scale=1"><title>Threads Dream</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#e56b9a">
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;color:#4b3435;background:#fffafc}.top{text-align:center;background:#f6b5ca;padding:7px;font-size:11px}.head{position:sticky;top:0;z-index:5;background:#fff;padding:8px 5%;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px #0001}.logo{width:115px;height:58px;object-fit:cover;border-radius:10px}.hero{padding:48px 8%;background:linear-gradient(120deg,#fff0f4,#fffaf6)}h1{font:52px Georgia}h1 span{color:#e56792}.btn{padding:12px 18px;border:0;border-radius:8px;font-weight:bold}.pink{background:#e56792;color:white}.sec{padding:40px 6%}.title{text-align:center;font:30px Georgia}.cats{display:flex;gap:8px;overflow:auto}.cats button{padding:9px 14px;border:1px solid #e5b2c3;background:#fff;border-radius:20px}.cats .active{background:#f8bfd1}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{background:#fff;border:1px solid #efd5df;border-radius:14px;overflow:hidden}.pic{height:210px;background:#ffe5ee;display:flex;align-items:center;justify-content:center;font-size:70px}.pic img{width:100%;height:100%;object-fit:cover}.body{padding:14px}.price{color:#c45179;font-weight:bold}.add{width:100%;padding:10px;margin-top:8px;border:1px solid #e56d95;background:#fff;color:#c45179;border-radius:7px}.cart{position:fixed;right:-430px;top:0;width:420px;max-width:94%;height:100%;background:#fff;z-index:20;padding:20px;transition:.25s;overflow:auto}.cart.open{right:0}.ov{display:none;position:fixed;inset:0;background:#0007;z-index:19}.ov.on{display:block}input,textarea{width:100%;padding:11px;margin:5px 0;border:1px solid #e4cbd3;border-radius:7px}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:550px){.grid{gap:10px}.pic{height:150px}.hero h1{font-size:40px}}</style><div class=top>✦ Handmade with Love ✦ Premium Quality ✦ Customized Just for You ✦</div><header class=head><img src="/threads-dream-logo.jpg" class=logo><button onclick=openCart()>🛍️ <sup id=count>0</sup></button></header><section class=hero><small>HANDMADE CROCHET CREATIONS</small><h1>Made With <span>Love</span> ♡</h1><p>Beautiful handmade crochet products for every occasion.</p><button class="btn pink" onclick="shop.scrollIntoView()">SHOP NOW</button></section><section class=sec id=shop><h2 class=title>Our Collection ♡</h2><div class=cats id=cats></div><div class=grid id=grid></div></section><section class=sec style="background:#fff0f4;text-align:center"><h2>Custom Order</h2><button class="btn pink" onclick=custom()>Request Custom Order</button></section><footer class=sec><h2>Threads Dream ♡</h2><p>Handmade Crochet Creations</p></footer><div class=ov id=ov onclick=closeCart()></div><aside class=cart id=cart><button onclick=closeCart()>✕</button><h2>Your Cart</h2><div id=items></div><h3>Total: ₹<span id=total>0</span></h3><input id=name placeholder="Your name"><input id=phone placeholder="Mobile / WhatsApp"><textarea id=address placeholder="Delivery address"></textarea><button class="btn pink" style="width:100%" onclick=order("UPI")>Pay via UPI</button><br><button class=btn style="width:100%;margin-top:6px" onclick=order("COD")>Cash on Delivery</button></aside><script>let S,C=[];async function load(){S=await(await fetch("/api/store")).json();cats.innerHTML='<button class=active onclick="filter(0,this)">All</button>'+S.categories.map(c=>`<button onclick="filter(${c.id},this)">${c.name}</button>`).join("");render(S.products)}function filter(id,b){document.querySelectorAll(".cats button").forEach(x=>x.classList.remove("active"));b.classList.add("active");render(id?S.products.filter(p=>p.category_id==id):S.products)}function render(a){grid.innerHTML=a.length?a.map(p=>`<article class=card><div class=pic>${p.image?`<img src="${p.image}">`:"🌸"}</div><div class=body><b>${p.name}</b><p class=price>₹${p.price} ${p.mrp?`<s style="color:#aaa">₹${p.mrp}</s>`:""}</p><button class=add onclick="add(${p.id})">Add to Cart</button></div></article>`).join(""):"<p>No products yet.</p>"}function add(id){let x=C.find(a=>a.id==id);x?x.qty++:C.push({id,qty:1});update();openCart()}function update(){count.textContent=C.reduce((a,x)=>a+x.qty,0);items.innerHTML=C.map(x=>{let p=S.products.find(p=>p.id==x.id);return`<div style="padding:10px 0;border-bottom:1px solid #eee"><b>${p.name}</b><br>₹${p.price} × ${x.qty}<br><button onclick="rem(${p.id})">Remove</button></div>`}).join("")||"<p>Cart empty</p>";total.textContent=C.reduce((a,x)=>a+S.products.find(p=>p.id==x.id).price*x.qty,0)}function rem(id){C=C.filter(x=>x.id!=id);update()}function openCart(){cart.classList.add("open");ov.classList.add("on")}function closeCart(){cart.classList.remove("open");ov.classList.remove("on")}async function order(method){if(!C.length)return alert("Cart empty");if(!name.value||!phone.value||!address.value)return alert("Fill all details");let r=await fetch("/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({customer_name:name.value,phone:phone.value,address:address.value,items:C,payment_method:method})}),o=await r.json();if(!r.ok)return alert(o.error);let msg=encodeURIComponent(`Hello Threads Dream, Order #${o.order_id}\nTotal ₹${o.total}\nName ${name.value}`);if(o.settings.whatsapp_number)window.open("https://wa.me/"+o.settings.whatsapp_number+"?text="+msg);if(method=="UPI"&&o.settings.upi_id)location.href=`upi://pay?pa=${encodeURIComponent(o.settings.upi_id)}&pn=${encodeURIComponent(o.settings.store_name)}&am=${o.total}&cu=INR&tn=Order%20${o.order_id}`;else alert("Order #"+o.order_id+" created");C=[];update();closeCart()}function custom(){if(S.settings.whatsapp_number)window.open("https://wa.me/"+S.settings.whatsapp_number+"?text="+encodeURIComponent("Hello Threads Dream, I want a custom order."));else alert("Configure WhatsApp in Admin")}load()</script>
